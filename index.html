<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KawanBelajar</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

    <link rel="stylesheet" href="src/css/variabels.css" />
    <link rel="stylesheet" href="src/css/components.css" />
    <link rel="stylesheet" href="src/css/animations.css" />
  </head>
  <body>
    <main class="desktop-frame">
      <div class="cloud-top">
        <img src="assets/images/top-cloud.png" alt="Awan Atas" />
      </div>

      <section class="main-content">
        <div class="text-section">
          <div class="title-group">
            <h1>Halo!</h1>
            <h1>KawanBelajar!</h1>
          </div>
          <p class="subtitle">Mau main game apa hari ini?</p>

          <div class="btn-wrapper">
            <button class="btn-primary" id="btnMulai">Ayo Mulai!</button>
            <div id="lottie-burst" class="lottie-container"></div>
          </div>
        </div>

        <div class="mascot-section">
          <img
            src="assets/images/hero-mascot-new.png"
            alt="Maskot KawanBelajar"
            class="mascot-image"
          />
        </div>
      </section>

      <div class="cloud-bottom">
        <img src="assets/images/bottom-cloud.png" alt="Awan Bawah" />
      </div>
    </main>

    <script src="src/js/config.js"></script>
    <script src="src/js/app.js"></script>
  </body>
</html>
