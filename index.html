<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KawanBelajar</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <main class="desktop-frame">
      <div class="cloud-top">
        <img src="assets/images/top-cloud.png" alt="Awan Atas" />
      </div>

      <section class="main-content">
        <div class="text-section">
          <div class="title-group">
            <h1>Halo!</h1>
            <h1>KawanBelajar!</h1>
          </div>
          <p class="subtitle">Mau main game apa hari ini?</p>

          <div class="btn-wrapper">
            <button class="btn-primary" id="btnMulai">Ayo Mulai!</button>
            <div id="lottie-burst" class="lottie-container"></div>
          </div>
        </div>

        <div class="mascot-section">
          <img
            src="assets/images/hero-mascot-new.png"
            alt="Maskot KawanBelajar"
            class="mascot-image"
          />
        </div>
      </section>

      <div class="cloud-bottom">
        <img src="assets/images/bottom-cloud.png" alt="Awan Bawah" />
      </div>
    </main>

    <!-- MENU SECTION -->
    <section id="menu-section" class="menu-section">
      <!-- Top Cloud -->
      <img
        src="assets/images/top-cloud.png"
        alt="Cloud Decoration"
        class="top-cloud-img"
      />

      <div class="menu-container">
        <h2 class="menu-title">Pilih Permainan!</h2>

        <!-- Carousel Wrapper -->
        <div class="carousel-wrapper">
          <button class="nav-btn prev-btn" id="prevBtn" aria-label="Previous">
            <
          </button>

          <div class="cards-viewport">
            <div class="cards-track" id="cardsTrack">
              <!-- Card 1: Membaca -->
              <div class="game-card">
                <h3>Membaca</h3>
                <img src="assets/images/menu-card_membaca.png" alt="Membaca" />
                <button class="btn-main">MAIN!</button>
              </div>

              <!-- Card 2: Mengetik -->
              <div class="game-card">
                <h3>Mengetik</h3>
                <img
                  src="assets/images/menu-card_mengetik.png"
                  alt="Mengetik"
                />
                <button class="btn-main">MAIN!</button>
              </div>

              <!-- Card 3: Tebak Lagu -->
              <div class="game-card">
                <h3>Tebak Lagu</h3>
                <img
                  src="assets/images/menu-card_tebakLagu.png"
                  alt="Tebak Lagu"
                />
                <button class="btn-main">MAIN!</button>
              </div>

              <!-- Card 4: Menghitung -->
              <div class="game-card">
                <h3>Menghitung</h3>
                <img
                  src="assets/images/menu-card_menghitung.png"
                  alt="Menghitung"
                />
                <button class="btn-main">MAIN!</button>
              </div>

              <!-- Card 5: Tebak Gambar -->
              <div class="game-card">
                <h3>Tebak Gambar</h3>
                <img
                  src="assets/images/menu-card_tebakGambar.png"
                  alt="Tebak Gambar"
                />
                <button class="btn-main">MAIN!</button>
              </div>
            </div>
          </div>

          <button class="nav-btn next-btn" id="nextBtn" aria-label="Next">
            >
          </button>
        </div>

        <!-- Dots Indicators -->
        <!-- Dots Indicators -->
        <div class="dots-container" id="dotsContainer">
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </section>

    <script src="src/js/config.js"></script>
    <script src="src/js/app.js"></script>
  </body>
</html>
